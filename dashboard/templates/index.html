<!DOCTYPE html>
<html>
<head>
    <title>FRED Commodity Pipeline</title>
</head>
<body>
    <a href="/trades">Trades</a>
    <a href="/trades/new">New Trade</a>
    <a href="/portfolio">Portfolio</a>
    <h1>Commodity Dashboard</h1>
    <table>
        <tr>
            <th>Series</th>
            <th>Date</th>
            <th>Value</th>
        </tr>
        {% for series_id, observations in historical_prices.items() %}
          {% for date, value in observations.items() %}
          <tr>
              <td>{{ series_id }}</td>
              <td>{{ date }}</td>
              <td>{{ value }}</td>
          </tr>
          {% endfor %}
        {% endfor %}
    </table>
</body>
</html>
