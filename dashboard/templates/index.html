<!DOCTYPE html>
<html>
<head>
    <title>FRED Commodity Pipeline</title>
</head>
<body>
    <h1>Commodity Dashboard</h1>
    <table>
        <tr>
            <th>Series</th>
            <th>Date</th>
            <th>Value</th>
        </tr>
        {% for row in historical_prices %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
