<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Commodity Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            background:#f8f9fa;
        }

        .card{
            border:none;
            border-radius:18px;
            box-shadow:0 8px 20px rgba(0,0,0,.05);
        }

        .commodity-btn{
            margin-right:8px;
            margin-bottom:8px;
        }

        #priceChart{
            height:500px;
        }

        .stat{
            font-size:.9rem;
            color:grey;
        }

        .value{
            font-size:1.5rem;
            font-weight:600;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1 class="fw-light mb-0">
                Commodity Dashboard
            </h1>

            <small class="text-muted">
                Daily market prices from FRED
            </small>

        </div>

        <a href="/portfolio" class="btn btn-dark">
            Portfolio
        </a>

    </div>


    <div class="row">

        <div class="col-lg-9">

            <div class="card p-4">

                <div class="mb-3">

                    {% for commodity in historical_prices.keys() %}

                        <button
                            class="btn btn-outline-dark commodity-btn"
                            onclick="updateChart('{{ commodity }}')">

                            {{ commodity }}

                        </button>

                    {% endfor %}

                </div>

                <canvas id="priceChart"></canvas>

            </div>

        </div>

        <div class="col-lg-3">

            <div class="card p-4">

                <h5 class="mb-4">

                    Latest Prices

                </h5>

                {% for series, price in latest_prices.items() %}

                    <div class="mb-4">

                        <div class="stat">

                            {{ series }}

                        </div>

                        <div class="value">

                            {{ price }}

                        </div>

                    </div>

                {% endfor %}

            </div>

        </div>

    </div>

</div>

<script>

const historicalData = {{ historical_prices | tojson }};

let chart;

function updateChart(series){

    const observations = historicalData[series];

    const labels = Object.keys(observations);

    const prices = Object.values(observations);

    if(chart){
        chart.destroy();
    }

    chart = new Chart(

        document.getElementById("priceChart"),

        {

            type:"line",

            data:{

                labels:labels,

                datasets:[{

                    label:series,

                    data:prices,

                    tension:0.25,

                    pointRadius:0,

                    borderWidth:2

                }]

            },

            options:{

                responsive:true,

                maintainAspectRatio:false,

                plugins:{

                    legend:{
                        display:false
                    }

                },

                scales:{

                    x:{

                        ticks:{
                            maxTicksLimit:8
                        }

                    }

                }

            }

        }

    );

}

updateChart(Object.keys(historicalData)[0]);

</script>

</body>
</html>
