<!DOCTYPE html>
<html>
<head>
    <title>FRED Commodity Pipeline</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <a href="/trades">Trades</a>
    <a href="/trades/new">New Trade</a>
    <a href="/portfolio">Portfolio</a>
    <h1>Commodity Dashboard</h1>

    <label for="series-select">Series:</label>
    <select id="series-select">
        {% for series_id in historical_prices.keys() %}
        <option value="{{ series_id }}">{{ series_id }}</option>
        {% endfor %}
    </select>

    <canvas id="price-chart" width="800" height="400"></canvas>

    <script>
        // historical_prices is now a real JS object, e.g.
        // { "WTI": {"2024-01-01": 71.2, "2024-01-02": 72.0, ...}, ... }
        const historicalPrices = {{ historical_prices | tojson }};

        const ctx = document.getElementById('price-chart').getContext('2d');
        let chart; // will hold the Chart.js instance so we can destroy/redraw it

        function renderChart(seriesId) {
            const observations = historicalPrices[seriesId];
            const labels = Object.keys(observations);
            const values = Object.values(observations);

            if (chart) {
                chart.destroy(); // clear the old chart before drawing a new one
            }

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: seriesId,
                        data: values,
                        borderWidth: 2,
                        fill: false
                    }]
                },
                options: {
                    scales: {
                        x: { title: { display: true, text: 'Date' } },
                        y: { title: { display: true, text: 'Price' } }
                    }
                }
            });
        }

        // Draw the first series on page load
        const select = document.getElementById('series-select');
        renderChart(select.value);

        // Redraw whenever the dropdown changes
        select.addEventListener('change', (event) => {
            renderChart(event.target.value);
        });
    </script>
</body>
</html>
