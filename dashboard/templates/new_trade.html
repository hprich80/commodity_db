{% extends "base.html" %}

{% block title %}New Trade — FRED Commodity Pipeline{% endblock %}

{% block content %}
    <h1>Enter Trade</h1>

    <div class="panel form-panel">
        <form method="POST" action="/trades/new" class="trade-form">
            <div class="form-row">
                <label for="series_id">Series</label>
                <select id="series_id" name="series_id" required>
                    {% for series_id, m in metadata.items() %}
                    <option value="{{ series_id }}">{{ series_id }} - {{ m['title'] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <label for="direction">Direction</label>
                <select id="direction" name="direction">
                    <option value="buy">Buy</option>
                    <option value="sell">Sell</option>
                </select>
            </div>

            <div class="form-row">
                <label for="trade_date">Trade Date</label>
                <input type="date" id="trade_date" name="trade_date" required>
            </div>

            <div class="form-row">
                <label for="price">Price</label>
                <input type="number" id="price" name="price" step="0.01" min="0" required>
            </div>

            <div class="form-row">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" min="1" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Submit Trade</button>
                <a href="/" class="btn-secondary">Back to Dashboard</a>
            </div>
        </form>
    </div>
{% endblock %}
